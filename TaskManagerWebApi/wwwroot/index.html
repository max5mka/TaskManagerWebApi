<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Task Manager Frontend</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .hidden {
            display: none;
        }

        .error {
            color: red;
        }

        .card {
            position: relative;
            border: 1px solid #ccc;
            padding: 30px 10px 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .card:hover {
            background-color: #f7f7f7;
        }

        .project-meta {
            position: absolute;
            top: 10px;
            color: #666;
            font-size: 0.85em;
        }

        .project-created {
            left: 10px;
        }

        .project-author {
            right: 10px;
            text-align: right;
        }

        #projects-list {
            margin-top: 10px;
        }

        input {
            margin-bottom: 10px;
            padding: 5px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 5px 15px;
            cursor: pointer;
        }

        .project-form {
            margin: 15px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .project-form textarea {
            margin-bottom: 10px;
            padding: 5px;
            width: 100%;
            min-height: 80px;
            box-sizing: border-box;
            resize: vertical;
        }

        .project-form input[type="datetime-local"] {
            width: 220px;
        }

        .project-form label {
            display: block;
            margin-bottom: 5px;
        }

        .project-form select {
            margin-bottom: 10px;
            padding: 5px;
            width: 220px;
        }

        .project-details {
            margin-top: 15px;
        }

        .project-details-list {
            padding-left: 20px;
        }
    </style>
</head>
<body>

    <!-- Блок Авторизации -->
    <div id="auth-section">

        <!-- ФОРМА ВХОДА -->
        <div id="login-form">
            <h2>Вход</h2>
            <input type="text" id="login-login" placeholder="Логин" />
            <input type="password" id="login-password" placeholder="Пароль" />
            <button onclick="login()">Войти</button>

            <!-- Кликабельный текст для перехода на регистрацию -->
            <p style="margin-top: 15px;">
                Нет аккаунта?
                <a href="#" onclick="toggleAuth('register'); return false;">Зарегистрироваться</a>
            </p>
        </div>

        <!-- ФОРМА РЕГИСТРАЦИИ (скрыта по умолчанию) -->
        <div id="register-form" class="hidden">
            <h2>Регистрация</h2>
            <input type="text" id="reg-name" placeholder="Имя" />
            <input type="text" id="reg-login" placeholder="Логин" />
            <input type="password" id="reg-password" placeholder="Пароль" />
            <button onclick="register()">Зарегистрироваться</button>

            <!-- Кликабельный текст для перехода на вход -->
            <p style="margin-top: 15px;">
                Уже есть аккаунт?
                <a href="#" onclick="toggleAuth('login'); return false;">Войти</a>
            </p>
        </div>

        <p id="auth-error" class="error"></p>
    </div>

    <!-- Блок с проектами (скрыт по умолчанию) -->
    <div id="projects-section" class="hidden">
        <h2>Мои проекты</h2>
        <button onclick="logout()">Выйти</button>
        <button onclick="showCreateProjectSection()">Создать проект</button>
        <button onclick="loadProjects()">Обновить список</button>

        <div id="projects-list"></div>
    </div>

    <!-- Страница создания проекта -->
    <div id="create-project-section" class="hidden">
        <h2>Создание проекта</h2>

        <form id="project-form" class="project-form" onsubmit="createProject(event)">
            <input type="text" id="project-title" placeholder="Название проекта" maxlength="200" required />
            <textarea id="project-description" placeholder="Описание проекта" maxlength="5000" required></textarea>
            <label for="project-start">Начало проекта</label>
            <input type="datetime-local" id="project-start" required />
            <label for="project-deadline">Дедлайн</label>
            <input type="datetime-local" id="project-deadline" required />
            <div>
                <button type="submit">Создать</button>
                <button type="button" onclick="showProjectsSection()">Назад к проектам</button>
            </div>
            <p id="project-error" class="error"></p>
        </form>
    </div>

    <!-- Страница подробностей проекта -->
    <div id="project-details-section" class="hidden">
        <h2 id="project-details-title"></h2>
        <button onclick="showProjectsSection()">Назад к проектам</button>
        <div id="project-details" class="project-details"></div>
    </div>

    <!-- Страница добавления участника -->
    <div id="add-member-section" class="hidden">
        <h2>Добавление участника</h2>

        <form id="member-form" class="project-form" onsubmit="addMember(event)">
            <input type="text" id="member-login" placeholder="Логин участника" required />
            <label for="member-role">Роль участника</label>
            <select id="member-role" required>
                <option value="Developer">Developer</option>
                <option value="Observer">Observer</option>
                <option value="Owner">Owner</option>
            </select>
            <div>
                <button type="submit">Добавить участника</button>
                <button type="button" onclick="showProjectDetailsSection()">Вернуться к проекту</button>
            </div>
            <p id="member-error" class="error"></p>
        </form>
    </div>

    <script>
        // Базовый URL твоего API (замени порт, если нужно)
        const API_URL = 'http://localhost:8080/api';
        let currentProjectId = null;

        function toggleAuth(form) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
        
            // Очищаем ошибки при переключении
            document.getElementById('auth-error').innerText = '';
        
            if (form === 'register') {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
            } else {
                registerForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
            }
        }

        // 1. Регистрация
        async function register() {
            const name = document.getElementById('reg-name').value;
            const login = document.getElementById('reg-login').value;
            const password = document.getElementById('reg-password').value;
        
            const res = await fetch(`${API_URL}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ firstName: name, login: login, password: password })
            });
        
            if (res.ok) {
                alert('Регистрация успешна! Теперь войдите.');
                toggleAuth('login'); // Переключаем на форму входа
            } else {
                document.getElementById('auth-error').innerText = 'Ошибка регистрации';
            }
        }

        // 2. Логин
        async function login() {
            const login = document.getElementById('login-login').value;
            const password = document.getElementById('login-password').value;
        
            const res = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: login, password: password })
            });
        
            if (res.ok) {
                const token = await res.text();
                localStorage.setItem('jwt_token', token);
                showProjectsSection();
                loadProjects();
            } else {
                document.getElementById('auth-error').innerText = 'Неверный логин или пароль';
            }
        }

        // 3. Загрузка проектов
        async function loadProjects() {
            const token = localStorage.getItem('jwt_token');
            if (!token) return;

            const res = await fetch(`${API_URL}/projects`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (res.status === 401) {
                logout();
                return;
            }

            if (res.ok) {
                const projects = await res.json();
                const listDiv = document.getElementById('projects-list');
                listDiv.innerHTML = ''; // Очистить старые данные

                if (projects.length === 0) {
                    listDiv.innerHTML = '<p>У вас пока нет проектов.</p>';
                    return;
                }

                projects.forEach(p => {
                    listDiv.innerHTML += `
                        <div class="card" onclick="loadProjectDetails(${p.id})" role="button" tabindex="0">
                            <div class="project-meta project-created">Создан: ${formatDate(p.createdAt, true)}</div>
                            <div class="project-meta project-author">Автор: ${p.creator?.login ?? '—'}</div>
                            <h3>${p.title}</h3>
                            <p>Статус: ${p.status}</p>
                            <p>Дата начала: ${formatDate(p.start)}</p>
                            <p>Дедлайн: ${formatDate(p.deadline)}</p>
                        </div>
                    `;
                });
            } else {
                document.getElementById('projects-list').innerText = 'Ошибка загрузки проектов';
            }
        }

        async function loadProjectDetails(projectId) {
            const token = localStorage.getItem('jwt_token');
            if (!token) return;

            currentProjectId = projectId;

            const res = await fetch(`${API_URL}/projects/${projectId}`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (res.status === 401) {
                logout();
                return;
            }

            if (!res.ok) {
                document.getElementById('projects-list').innerText = 'Ошибка загрузки проекта';
                return;
            }

            const project = await res.json();
            const members = project.members?.length
                ? project.members.map(member =>
                    `<li>${member.firstName} (${member.login}) — ${member.projetRole}</li>`).join('')
                : '<li>У проекта пока нет участников</li>';
            const tasks = project.tasks?.length
                ? project.tasks.map(task => `
                    <li>
                        ${task.title} — ${task.status}, приоритет: ${task.priority},
                        часов: ${task.hoursToDo}, выполнено: ${task.hoursLogged}
                    </li>
                `).join('')
                : '<li>У проекта пока нет задач</li>';
            const currentUserLogin = getCurrentUserLogin();
            const canAddMember = project.members?.some(member =>
                member.login === currentUserLogin
                && member.projetRole?.toUpperCase() === 'OWNER');
            const addMemberButton = canAddMember
                ? '<button onclick="showAddMemberSection()">Добавить участника</button>'
                : '';

            document.getElementById('project-details-title').innerText = project.title;
            document.getElementById('project-details').innerHTML = `
                <p><strong>Описание:</strong> ${project.description}</p>
                <p><strong>Статус:</strong> ${project.status}</p>
                <p><strong>Создатель:</strong> ${project.creator?.login ?? '—'}</p>
                <p><strong>Дата создания:</strong> ${formatDate(project.createdAt, true)}</p>
                <p><strong>Дата начала:</strong> ${formatDate(project.start)}</p>
                <p><strong>Дедлайн:</strong> ${formatDate(project.deadline)}</p>
                <p><strong>Всего часов:</strong> ${project.totalHours}</p>
                <p><strong>Затрачено часов:</strong> ${project.hoursSpent}</p>
                <h3>Участники</h3>
                <ul class="project-details-list">${members}</ul>
                ${addMemberButton}
                <h3>Задачи</h3>
                <ul class="project-details-list">${tasks}</ul>
            `;

            showProjectDetailsSection();
        }

        function getCurrentUserLogin() {
            try {
                const token = localStorage.getItem('jwt_token');
                if (!token) return null;

                const payload = token.split('.')[1]
                    .replace(/-/g, '+')
                    .replace(/_/g, '/');
                const claims = JSON.parse(atob(payload));

                return claims['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name']
                    || claims.name
                    || claims.unique_name
                    || null;
            } catch {
                return null;
            }
        }

        function showAddMemberSection() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('projects-section').classList.add('hidden');
            document.getElementById('create-project-section').classList.add('hidden');
            document.getElementById('project-details-section').classList.add('hidden');
            document.getElementById('add-member-section').classList.remove('hidden');
            document.getElementById('member-error').innerText = '';
        }

        async function addMember(event) {
            event.preventDefault();

            const token = localStorage.getItem('jwt_token');
            if (!token || !currentProjectId) return;

            const errorElement = document.getElementById('member-error');
            errorElement.innerText = '';

            const member = {
                memberLogin: document.getElementById('member-login').value,
                role: document.getElementById('member-role').value
            };

            try {
                const res = await fetch(`${API_URL}/projects/${currentProjectId}/members/by-login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(member)
                });

                if (res.status === 401) {
                    logout();
                    return;
                }

                if (!res.ok) {
                    const error = await res.json().catch(() => null);
                    errorElement.innerText = error?.[0]?.errorMessage || error?.message || 'Ошибка добавления участника';
                    return;
                }

                document.getElementById('member-form').reset();
                await loadProjectDetails(currentProjectId);
            } catch {
                errorElement.innerText = 'Не удалось подключиться к серверу';
            }
        }

        function formatDate(value, isUtc = false) {
            if (!value) return '—';

            const dateValue = isUtc && !/[zZ]|[+-]\d{2}:?\d{2}$/.test(value)
                ? `${value}Z`
                : value;
            const date = new Date(dateValue);
            if (Number.isNaN(date.getTime())) {
                return value.replace('T', ' ');
            }

            return date.toLocaleString('ru-RU', {
                dateStyle: 'short',
                timeStyle: 'short'
            });
        }

        async function createProject(event) {
            event.preventDefault();

            const token = localStorage.getItem('jwt_token');
            if (!token) return;

            const project = {
                title: document.getElementById('project-title').value,
                description: document.getElementById('project-description').value,
                start: document.getElementById('project-start').value,
                deadline: document.getElementById('project-deadline').value
            };

            const errorElement = document.getElementById('project-error');
            errorElement.innerText = '';

            try {
                const res = await fetch(`${API_URL}/projects`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(project)
                });

                if (!res.ok) {
                    if (res.status === 401) {
                        logout();
                        return;
                    }

                    const error = await res.json().catch(() => null);
                    errorElement.innerText = error?.[0]?.errorMessage || 'Ошибка создания проекта';
                    return;
                }

                document.getElementById('project-form').reset();
                showProjectsSection();
                await loadProjects();
            } catch {
                errorElement.innerText = 'Не удалось подключиться к серверу';
            }
        }

        // 4. Выход
        function logout() {
            localStorage.removeItem('jwt_token');
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('projects-section').classList.add('hidden');
            document.getElementById('create-project-section').classList.add('hidden');
            document.getElementById('project-details-section').classList.add('hidden');
            document.getElementById('add-member-section').classList.add('hidden');
        }

        function showProjectsSection() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('projects-section').classList.remove('hidden');
            document.getElementById('create-project-section').classList.add('hidden');
            document.getElementById('project-details-section').classList.add('hidden');
            document.getElementById('add-member-section').classList.add('hidden');
            document.getElementById('project-error').innerText = '';
        }

        function showCreateProjectSection() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('projects-section').classList.add('hidden');
            document.getElementById('create-project-section').classList.remove('hidden');
            document.getElementById('project-details-section').classList.add('hidden');
            document.getElementById('add-member-section').classList.add('hidden');
            document.getElementById('project-error').innerText = '';
        }

        function showProjectDetailsSection() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('projects-section').classList.add('hidden');
            document.getElementById('create-project-section').classList.add('hidden');
            document.getElementById('project-details-section').classList.remove('hidden');
            document.getElementById('add-member-section').classList.add('hidden');
        }

        // Проверяем, есть ли уже токен при загрузке страницы
        if (localStorage.getItem('jwt_token')) {
            showProjectsSection();
            loadProjects();
        }
    </script>
</body>
</html>
